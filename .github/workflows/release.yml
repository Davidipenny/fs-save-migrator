name: Release

# 推送 v* 标签触发：测试 → 构建 exe + wheel/sdist → 创建 GitHub Release 附产物
# 用法：git tag v2.0.0 && git push origin v2.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-exe:
    name: Windows exe
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest   # 真实存档不入库，相关用例自动 skip

      - name: Build exe
        run: pyinstaller fs_save_migrator.spec --noconfirm

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fs-save-migrator.exe

  build-python:
    name: wheel + sdist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build
        run: pip install build

      - name: Build
        run: python -m build

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
